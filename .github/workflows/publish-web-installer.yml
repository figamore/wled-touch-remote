name: Publish web installer

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tools
        run: python -m pip install --upgrade platformio esptool

      - name: Set up Emscripten
        run: |
          emsdk_dir="$RUNNER_TEMP/emsdk"
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$emsdk_dir"
          "$emsdk_dir/emsdk" install 4.0.7
          "$emsdk_dir/emsdk" activate 4.0.7
          echo "$emsdk_dir/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Build browser simulators
        run: |
          pio pkg install -e macos
          bash tools/build_web_simulator.sh jc4880p443

      - name: Build Wi-Fi firmware
        run: |
          set -euo pipefail
          mkdir -p web-installer/build
          pio run -e esp32-cyd
          cp -a .pio/build/esp32-cyd web-installer/build/esp32-cyd
          pio run -e jc4880p443
          cp -a .pio/build/jc4880p443 web-installer/build/jc4880p443

      - name: Package firmware for Web Serial
        run: |
          set -euo pipefail
          mkdir -p web-installer/firmware
          boot_app0="$(find "$HOME/.platformio/packages/framework-arduinoespressif32" -name boot_app0.bin -print -quit)"
          if [ -z "$boot_app0" ]; then
            echo "boot_app0.bin not found"
            exit 1
          fi
          python -m esptool --chip esp32 merge_bin --flash_mode dio --flash_freq 40m --flash_size 4MB \
            -o web-installer/firmware/wled-touch-remote-wifi.bin \
            0x1000 web-installer/build/esp32-cyd/bootloader.bin \
            0x8000 web-installer/build/esp32-cyd/partitions.bin \
            0xE000 "$boot_app0" \
            0x10000 web-installer/build/esp32-cyd/firmware.bin
          python -m esptool --chip esp32p4 merge_bin --flash_mode dio --flash_freq 40m --flash_size 16MB \
            -o web-installer/firmware/wled-touch-remote-jc4880p443.bin \
            0x2000 web-installer/build/jc4880p443/bootloader.bin \
            0x8000 web-installer/build/jc4880p443/partitions.bin \
            0x10000 web-installer/build/jc4880p443/firmware.bin
          printf '%s\n' '{"name":"WLED Touch Remote — ESP32-CYD","version":"main","new_install_improv":true,"builds":[{"chipFamily":"ESP32","parts":[{"path":"firmware/wled-touch-remote-wifi.bin","offset":0}]}]}' > web-installer/manifest-esp32-cyd.json
          printf '%s\n' '{"name":"WLED Touch Remote — ESP32-P4 (JC4880P443)","version":"main","new_install_improv":true,"builds":[{"chipFamily":"ESP32-P4","parts":[{"path":"firmware/wled-touch-remote-jc4880p443.bin","offset":0}]}]}' > web-installer/manifest-jc4880p443.json
          printf '%s\n' '{"name":"WLED Touch Remote","tag_name":"main"}' > web-installer/release.json

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web-installer
      - uses: actions/deploy-pages@v5
        id: deploy
