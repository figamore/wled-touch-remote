name: Publish web installer

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tools
        run: python -m pip install --upgrade platformio

      - name: Set up Emscripten
        run: |
          emsdk_dir="$RUNNER_TEMP/emsdk"
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$emsdk_dir"
          "$emsdk_dir/emsdk" install 4.0.7
          "$emsdk_dir/emsdk" activate 4.0.7
          echo "$emsdk_dir/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Download release firmware
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          mkdir -p web-installer/firmware
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir web-installer/firmware \
            --pattern "wled-touch-remote-${tag}-esp32-cyd-merged.bin" \
            --pattern "wled-touch-remote-${tag}-jc4880p443-merged.bin" \
            --pattern "wled-touch-remote-${tag}-jc8048w550c-merged.bin"
          mv "web-installer/firmware/wled-touch-remote-${tag}-esp32-cyd-merged.bin" \
            web-installer/firmware/wled-touch-remote-wifi.bin
          mv "web-installer/firmware/wled-touch-remote-${tag}-jc4880p443-merged.bin" \
            web-installer/firmware/wled-touch-remote-jc4880p443.bin
          mv "web-installer/firmware/wled-touch-remote-${tag}-jc8048w550c-merged.bin" \
            web-installer/firmware/wled-touch-remote-jc8048w550c.bin

      - name: Build browser simulators
        env:
          WLED_TOUCH_VERSION: ${{ steps.release.outputs.version }}
        run: |
          pio pkg install -e macos
          bash tools/build_web_simulator.sh jc4880p443

      - name: Create Web Serial manifests
        run: |
          set -euo pipefail
          printf '%s\n' '{"name":"WLED Touch Remote — ESP32-CYD","version":"${{ steps.release.outputs.tag }}","new_install_improv":true,"builds":[{"chipFamily":"ESP32","parts":[{"path":"firmware/wled-touch-remote-wifi.bin","offset":0}]}]}' > web-installer/manifest-esp32-cyd.json
          printf '%s\n' '{"name":"WLED Touch Remote — ESP32-P4 (JC4880P443)","version":"${{ steps.release.outputs.tag }}","new_install_improv":true,"builds":[{"chipFamily":"ESP32-P4","parts":[{"path":"firmware/wled-touch-remote-jc4880p443.bin","offset":0}]}]}' > web-installer/manifest-jc4880p443.json
          printf '%s\n' '{"name":"WLED Touch Remote — ESP32-S3 (JC8048W550C)","version":"${{ steps.release.outputs.tag }}","new_install_improv":true,"builds":[{"chipFamily":"ESP32-S3","parts":[{"path":"firmware/wled-touch-remote-jc8048w550c.bin","offset":0}]}]}' > web-installer/manifest-jc8048w550c.json
          printf '%s\n' '{"name":"WLED Touch Remote","tag_name":"${{ steps.release.outputs.tag }}"}' > web-installer/release.json

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web-installer
      - uses: actions/deploy-pages@v5
        id: deploy
