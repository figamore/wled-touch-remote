[env:esp32-cyd]
; Arduino-ESP32 3.x / ESP-IDF 5 is required for the persistent mDNS browse API
; used by WLED discovery.  Keep this aligned with the P4 environment below.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 748800
monitor_filters=esp32_exception_decoder


lib_deps =
    lvgl/lvgl@^8.3.11
    bblanchon/ArduinoJson@^7.0.4

build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -D CORE_DEBUG_LEVEL=1

; Two 1.69 MiB app slots permit verified OTA updates on 4 MiB CYDs. The
; factory/merged image writes this partition table during the one-time USB
; flash; subsequent updates replace only the inactive app slot.
board_build.partitions = partitions/cyd_ota.csv
extra_scripts =
    pre:scripts/embed_logo.py
    pre:scripts/git_version.py

[env:esp32-cyd-capacitive]
; Backward-compatible alias. The default esp32-cyd firmware now supports
; capacitive boards automatically and prompts for a tap on resistive boards.
extends = env:esp32-cyd

;Use for extracting screenshots from the device
[env:esp32-cyd-screenshot]
extends = env:esp32-cyd
monitor_speed = 748800
build_flags =
    ${env:esp32-cyd.build_flags}
    -D WLED_CYD_ENABLE_SERIAL_SCREENSHOT=1
    -D WLED_CYD_SERIAL_BAUD=748800

[env:esp32-cyd-capacitive-no-battery]
extends = env:esp32-cyd-capacitive
build_flags =
    ${env:esp32-cyd.build_flags}
    -D WLED_CYD_ENABLE_BATTERY=0

[env:esp32-cyd-resistive]
; Manual profile for hardware debugging; normal users should use esp32-cyd.
extends = env:esp32-cyd
build_flags =
    ${env:esp32-cyd.build_flags}
    -D CYD_HARDWARE_PROFILE=CYD_PROFILE_ILI9341_XPT2046
    -D CYD_BOARD_CAPACITIVE=0
    -D WLED_CYD_ENABLE_BATTERY=0

[env:esp32-cyd-resistive-st7789]
; Manual profile for ST7789 + XPT2046 resistive hardware debugging.
extends = env:esp32-cyd
build_flags =
    ${env:esp32-cyd.build_flags}
    -D CYD_HARDWARE_PROFILE=CYD_PROFILE_ST7789_XPT2046
    -D CYD_BOARD_CAPACITIVE=0
    -D WLED_CYD_ENABLE_BATTERY=0

[env:esp32-cyd-capacitive-ip5306-shutdown]
extends = env:esp32-cyd-capacitive
build_flags =
    ${env:esp32-cyd.build_flags}
    -D WLED_CYD_ENABLE_SHUTDOWN=1
    -D WLED_CYD_SHUTDOWN_GPIO=17
    -D WLED_CYD_SHUTDOWN_PULLUP=1
    -D WLED_CYD_SHUTDOWN_DOUBLE_TAP_MS=650
    -D WLED_CYD_SHUTDOWN_TAP_LOCKOUT_MS=60
    -D WLED_CYD_SHUTDOWN_HOLD_MS=10200
    -D WLED_CYD_SHUTDOWN_DEBUG=0

[env:jc4880p443]
; Guition JC4880P443 (ESP32-P4 + ESP32-C6, 4.3" 480x800 ST7701S MIPI-DSI, GT911 touch).
; ESP32-P4 needs the pioarduino platform fork; the official espressif32 platform
; has no P4 support. Wi-Fi runs on the on-board C6 via ESP-Hosted.
; Serial runs over the P4's native USB-C port; use it for flashing and monitoring.
; This board selects the esp32p4_es library set for pre-rev.300 silicon (the ROM
; banner reports "esp32p4-eco2"). On rev.300 chips use esp32-p4_r3-evboard instead
; -- the variants ship different prebuilt libraries and mixing them panics at boot.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-p4-evboard
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
monitor_filters = esp32_exception_decoder

lib_deps =
    lvgl/lvgl@^8.3.11
    bblanchon/ArduinoJson@^7.0.4

build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -D CORE_DEBUG_LEVEL=1
    -D WLED_BOARD=WLED_BOARD_JC4880P443
    ; esp32-p4-evboard omits these, unlike the rev.300 profile; without them
    ; Serial lands on UART0 instead of the USB-C port used for flashing.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

board_build.partitions = default_16MB.csv
extra_scripts =
    pre:scripts/embed_logo.py
    pre:scripts/git_version.py
    pre:scripts/embed_hosted_firmware.py

[env:jc8048w550c]
; Jingcai JC8048W550C, also sold as the Sunton ESP32-8048S050 (ESP32-S3 with a
; 5" 800x480 ST7262 RGB panel and GT911 touch).  The 16-bit parallel panel needs
; a PSRAM frame buffer, so this assumes the usual ESP32-S3-WROOM-1 N16R8 module:
; 16 MB flash and octal PSRAM. On a 4 MB module drop the flash size and
; partition table to 4 MB; with quad PSRAM use memory_type qio_qspi instead.
; Serial runs over the on-board USB-UART bridge at 115200 baud.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

lib_deps =
    lvgl/lvgl@^8.3.11
    bblanchon/ArduinoJson@^7.0.4

build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -D CORE_DEBUG_LEVEL=1
    -D WLED_BOARD=WLED_BOARD_JC8048W550C
    -D BOARD_HAS_PSRAM

extra_scripts =
    pre:scripts/embed_logo.py
    pre:scripts/git_version.py

[env:macos]
; MacOS simulator
; First, install sdl2 using: brew install sdl2
; Build: pio run -e macos
; Run: .pio/build/macos/program
platform = native
build_type = release

lib_deps =
    lvgl/lvgl@^8.3.11
    bblanchon/ArduinoJson@^7.0.4

build_flags =
    -O0
    -std=c++17
    -lSDL2
    -D LV_CONF_INCLUDE_SIMPLE
    -D WLED_TOUCH_SIMULATOR=1
    -D LGFX_SDL
    -D WLED_CYD_ENABLE_BATTERY=1
    -I include/sim
    -I include
    -I"${sysenv.HOMEBREW_PREFIX}/include/SDL2"
    -L"${sysenv.HOMEBREW_PREFIX}/lib"
    -I"/usr/local/include/SDL2"
    -L"/usr/local/lib"
    -include sim/sdl_prelude.h

build_src_filter =
    +<*>
    -<BatteryMonitor.cpp>

extra_scripts =
    pre:scripts/embed_logo.py
    pre:scripts/git_version.py

[env:macos-jc4880p443]
; Native SDL simulator using the JC4880P443's 480x800 portrait layout.
extends = env:macos
build_unflags =
    -D WLED_CYD_ENABLE_BATTERY=1
build_flags =
    ${env:macos.build_flags}
    -D WLED_BOARD=WLED_BOARD_JC4880P443
    -D WLED_CYD_ENABLE_BATTERY=0

[env:macos-jc8048w550c]
; Native SDL simulator using the JC8048W550C's 800x480 landscape layout.
extends = env:macos
build_unflags =
    -D WLED_CYD_ENABLE_BATTERY=1
build_flags =
    ${env:macos.build_flags}
    -D WLED_BOARD=WLED_BOARD_JC8048W550C
    -D WLED_CYD_ENABLE_BATTERY=0
